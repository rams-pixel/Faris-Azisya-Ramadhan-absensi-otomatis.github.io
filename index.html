<head>

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    min-height: 100vh;
    background:
        radial-gradient(ellipse at 20% 20%, rgba(37,99,235,.18) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(59,130,246,.12) 0%, transparent 50%),
        linear-gradient(160deg, #0a0f1c 0%, #0f172a 40%, #1e3a8a 100%);
    color: #f1f5f9;
    font-family: 'Inter', system-ui, sans-serif;
    padding: 40px 20px 60px;
    overflow-x: hidden;
}

.container { max-width: 1100px; margin: auto; }

/* HEADER */
.header { text-align: center; margin-bottom: 48px; }

.header h1 {
    font-size: 2.2rem;
    font-weight: 700;
    letter-spacing: -.8px;
    background: linear-gradient(135deg, #fff 30%, #93c5fd 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
}

.header p { color: #94a3b8; font-size: .95rem; }

.center-area { display: flex; justify-content: center; margin-bottom: 40px; }

/* CARD */
.card {
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 28px;
    padding: 36px;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow: 0 25px 50px -12px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.06);
}

.tap-page { width: 100%; max-width: 420px; }
.tap-area { text-align: center; }

.tap-icon {
    width: 88px;
    height: 88px;
    margin: 0 auto 24px;
    background: linear-gradient(145deg, #3b82f6, #1d4ed8);
    border-radius: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 16px 32px -8px rgba(37,99,235,.5);
}

.tap-icon svg { width: 40px; height: 40px; fill: white; }

.tap-area h3 { font-size: 1.4rem; margin-bottom: 8px; }

.tap-area p {
    color: #94a3b8;
    font-size: .9rem;
    margin-bottom: 28px;
    min-height: 22px;
}

.scan-status.scanning { color: #fbbf24; }
.scan-status.success  { color: #4ade80; font-weight: 500; }
.scan-status.failed   { color: #f87171; }

.student-select {
    width: 100%;
    margin-bottom: 20px;
    padding: 15px 18px;
    border: 1px solid rgba(148,163,184,.2);
    border-radius: 16px;
    background: rgba(15,23,42,.6);
    color: white;
    font-size: .95rem;
    outline: none;
    cursor: pointer;
}

.student-select option { background: #0f172a; color: white; }

/* TOMBOL */
.btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 16px;
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: .3s;
}

.btn-tap {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    box-shadow: 0 12px 24px -6px rgba(37,99,235,.45);
}

.btn-tap:hover:not(:disabled) { transform: translateY(-3px); }
.btn-tap:disabled { opacity: .65; cursor: not-allowed; }

.btn-back {
    background: rgba(71,85,105,.5);
    margin-top: 24px;
    border: 1px solid rgba(148,163,184,.15);
}

.btn-back:hover { background: rgba(71,85,105,.75); }

.btn-download {
    background: linear-gradient(135deg, #0ea5e9, #0284c7);
    box-shadow: 0 8px 20px -6px rgba(14,165,233,.4);
    margin-top: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

.btn-download svg { width: 20px; height: 20px; fill: white; }

/* HALAMAN DATA */
.data-page { display: none; width: 100%; max-width: 460px; }

.attendance-result { text-align: center; margin-bottom: 28px; }

.attendance-check {
    width: 84px;
    height: 84px;
    margin: 0 auto 14px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(34,197,94,.12);
    color: #4ade80;
    border: 2.5px solid #4ade80;
    box-shadow: 0 0 32px rgba(74,222,128,.25);
}

.attendance-check.terlambat {
    background: rgba(239,68,68,.12);
    color: #f87171;
    border-color: #f87171;
    box-shadow: 0 0 32px rgba(248,113,113,.25);
}

.attendance-check svg { width: 36px; height: 36px; }

.attendance-result-text { font-size: 1.2rem; font-weight: 600; color: #e2e8f0; }

.photo-frame { display: none; margin: 0 auto 28px; width: max-content; }

.student-photo {
    width: 148px;
    height: 148px;
    object-fit: cover;
    border-radius: 22px;
    border: 3px solid rgba(96,165,250,.4);
    box-shadow: 0 16px 32px -8px rgba(0,0,0,.4);
}

.data-row {
    display: grid;
    grid-template-columns: 120px 1fr;
    padding: 13px 0;
    border-bottom: 1px solid rgba(255,255,255,.06);
    font-size: .93rem;
}

.label { color: #94a3b8; font-weight: 500; }
.value { font-weight: 600; color: #f8fafc; }

.status {
    margin-top: 24px;
    padding: 15px;
    text-align: center;
    border-radius: 16px;
    background: rgba(34,197,94,.12);
    color: #4ade80;
    font-weight: 600;
    border: 1px solid rgba(74,222,128,.2);
    font-size: .95rem;
}

.status.terlambat {
    background: rgba(239,68,68,.12);
    color: #f87171;
    border-color: rgba(248,113,113,.3);
}

.qrcode-box {
    display: none;
    margin: 24px auto 0;
    padding: 16px;
    background: white;
    border-radius: 18px;
    width: max-content;
    box-shadow: 0 12px 28px -6px rgba(0,0,0,.35);
    text-align: center;
}

/* RIWAYAT */
.history-card {
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 24px;
    padding: 28px;
    backdrop-filter: blur(20px);
}

.history-card h2 {
    font-size: 1.15rem;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.history-card h2 svg { width: 22px; height: 22px; fill: #93c5fd; }

.table-wrapper { overflow-x: auto; border-radius: 14px; }
.riwayat-scroll { max-height: 520px; overflow-y: auto; }
.riwayat-scroll th { position: sticky; top: 0; z-index: 1; background: #1e3a8a; }
.riwayat-info { color: #94a3b8; font-size: .85rem; margin: -8px 0 16px; }

table { width: 100%; border-collapse: collapse; min-width: 720px; font-size: .87rem; }

th {
    background: rgba(37,99,235,.25);
    padding: 14px 12px;
    text-align: left;
    color: #bfdbfe;
    white-space: nowrap;
}

td {
    padding: 14px 12px;
    border-bottom: 1px solid rgba(255,255,255,.05);
    color: #e2e8f0;
}

.hadir, .terlambat {
    display: inline-block;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: .78rem;
    font-weight: 600;
}

.hadir     { background: rgba(22,163,74,.2); color: #4ade80; }
.terlambat { background: rgba(239,68,68,.2); color: #f87171; }

.kosong { text-align: center; color: #94a3b8; padding: 48px 20px; }

/* ANIMASI HALAMAN */
.page-visible { animation: fadeUp .45s ease both; }
.page-hiding  { animation: fadeOut .22s ease both; }

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px) scale(.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes fadeOut {
    from { opacity: 1; transform: translateY(0); }
    to   { opacity: 0; transform: translateY(-12px); }
}

/* TOAST */
.toast-container {
    position: fixed;
    top: 24px;
    right: 24px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 12px;
    pointer-events: none;
}

.toast {
    background: rgba(15,23,42,.95);
    border-radius: 16px;
    padding: 16px 20px;
    min-width: 300px;
    max-width: 400px;
    box-shadow: 0 12px 32px -8px rgba(0,0,0,.5);
    display: flex;
    align-items: flex-start;
    gap: 14px;
    animation: toastIn .4s cubic-bezier(.16,1,.3,1) both;
    pointer-events: auto;
    border: 1px solid rgba(74,222,128,.4);
}

.toast.late { border-color: rgba(248,113,113,.5); }
.toast.hide { animation: toastOut .3s ease both; }

.toast-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: rgba(34,197,94,.15);
    color: #4ade80;
}

.toast.late .toast-icon { background: rgba(239,68,68,.15); color: #f87171; }
.toast-icon svg { width: 22px; height: 22px; }

.toast-content { flex: 1; }
.toast-title   { font-weight: 600; font-size: .95rem; color: #f1f5f9; margin-bottom: 4px; }
.toast-message { font-size: .85rem; color: #94a3b8; line-height: 1.4; }

@keyframes toastIn {
    from { opacity: 0; transform: translateX(40px) scale(.95); }
    to   { opacity: 1; transform: translateX(0) scale(1); }
}

@keyframes toastOut {
    from { opacity: 1; transform: translateX(0); }
    to   { opacity: 0; transform: translateX(40px); }
}

/* RESPONSIF */
@media (max-width: 640px) {
    .header h1 { font-size: 1.75rem; }
    body { padding: 24px 16px 48px; }
    .card { padding: 28px 22px; }
    .tap-icon { width: 76px; height: 76px; }
    .tap-icon svg { width: 34px; height: 34px; }
    .toast-container { top: 16px; right: 16px; left: 16px; }
    .toast { min-width: auto; max-width: 100%; }
}

function jelaskanKesalahanServer(teks) {
    if (/^\s*<\?php/i.test(teks)) {
        return "PHP tidak dijalankan (kode PHP tampil sebagai teks). Buka lewat http://localhost/... dengan Apache XAMPP, bukan Live Server.";
    }

    const ringkas = teks.replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim().slice(0, 160);
    return "Respons server bukan JSON: " + (ringkas || "(kosong)");
}

async function panggilApi(url, opsi = {}) {
    let response;

    try {
        response = await fetch(url, { cache: "no-store", ...opsi });
    } catch (e) {
        throw new Error(
            location.protocol === "file:"
                ? "Halaman dibuka lewat file://. Buka lewat http://localhost/... (XAMPP) agar PHP berjalan."
                : "Tidak bisa menghubungi server. Pastikan Apache & MySQL di XAMPP sudah Start."
        );
    }

    const teks = await response.text();
    let hasil;

    try {
        hasil = JSON.parse(teks);
    } catch (e) {
        throw new Error(jelaskanKesalahanServer(teks));
    }

    if (!response.ok || !hasil.success) {
        const error = new Error(hasil.message || "Permintaan gagal");
        error.duplikat = Boolean(hasil.duplikat);
        throw error;
    }

    return hasil;
}

function formatTanggalDB(waktu) {
    return [
        waktu.getFullYear(),
        String(waktu.getMonth() + 1).padStart(2, "0"),
        String(waktu.getDate()).padStart(2, "0")
    ].join("-");
}

function formatJamDB(waktu) {
    return [
        String(waktu.getHours()).padStart(2, "0"),
        String(waktu.getMinutes()).padStart(2, "0"),
        String(waktu.getSeconds()).padStart(2, "0")
    ].join(":");
}

function setReader(teks, kelas = "") {
    reader.textContent = teks;
    reader.className = "scan-status" + (kelas ? " " + kelas : "");
}


/* =========================================================
   DATA SISWA (dari database)
   ========================================================= */

async function muatSiswa() {
    let dataSiswa;

    try {
        dataSiswa = (await panggilApi(URL_API_SISWA)).data;
    } catch (error) {
        console.warn("Pakai data siswa cadangan:", error.message);
        dataSiswa = SISWA_CADANGAN;
    }

    daftarSiswa = dataSiswa.map(function (s) {
        const bagian = String(s.kelas || "").split(" ");

        return {
            id: s.id,
            nama: s.nama,
            absen: String(s.nomor_absen),
            nis: s.nis || "-",
            kelas: bagian[0] || "-",
            jurusan: bagian.slice(1).join(" ") || "-",
            foto: FOTO_SISWA[s.nomor_absen] || FOTO_DEFAULT
        };
    });

    pilihSiswa.innerHTML = "";
    daftarSiswa.forEach(function (siswa) {
        pilihSiswa.add(new Option(`${siswa.absen} - ${siswa.nama}`, siswa.absen));
    });
}

function gantiSiswa(absen) {
    siswaKartu = daftarSiswa.find(function (s) { return s.absen === absen; }) || null;
    siswaAktif = siswaKartu;
    setReader("Menunggu kartu...");
}


/* =========================================================
   RIWAYAT (dari database)
   ========================================================= */

async function tampilkanRiwayat() {
    const tabel = document.getElementById("riwayat");

    try {
        const hasil = await panggilApi(URL_API_KEHADIRAN);
        const data  = hasil.data;

        tabel.innerHTML = "";
        document.getElementById("riwayatInfo").textContent =
            data.length + " catatan presensi dari seluruh siswa (diperbarui otomatis)";

        if (data.length === 0) {
            const baris = tabel.insertRow();
            const sel = baris.insertCell();
            sel.colSpan = 9;
            sel.className = "kosong";
            sel.textContent = "Belum ada data presensi";
            return;
        }

        data.forEach(function (rec, i) {
            const baris = tabel.insertRow();
            const tanggal = new Date(rec.tanggal + "T00:00:00").toLocaleDateString("id-ID");

            [i + 1, rec.nama, rec.absen, rec.siswa_id, rec.nis, rec.kelas, tanggal, rec.jam]
                .forEach(function (nilai) {
                    baris.insertCell().textContent = nilai || "-";
                });

            const sel = baris.insertCell();
            const badge = document.createElement("span");
            badge.className = rec.status === "Hadir" ? "hadir" : "terlambat";
            badge.textContent = rec.status === "Terlambat" ? teksTerlambatDariJam(rec.jam) : rec.status;
            sel.appendChild(badge);
        });

    } catch (error) {
        tabel.innerHTML = "";
        document.getElementById("riwayatInfo").textContent = "";
        const baris = tabel.insertRow();
        const sel = baris.insertCell();
        sel.colSpan = 9;
        sel.className = "kosong";
        sel.textContent = "Riwayat gagal dimuat: " + error.message;
    }
}


/* =========================================================
   NOTIFIKASI
   ========================================================= */

function mintaIzinNotifikasi() {
    if ("Notification" in window && Notification.permission === "default") {
        Notification.requestPermission();
    }
}

function tampilkanNotifikasi(judul, pesan, isTerlambat = false) {
    const container = document.getElementById("toastContainer");
    const toast = document.createElement("div");
    toast.className = "toast" + (isTerlambat ? " late" : "");

    const ikon = document.createElement("div");
    ikon.className = "toast-icon";
    ikon.innerHTML = isTerlambat ? SVG_WARNING : SVG_CHECK;

    const isi = document.createElement("div");
    isi.className = "toast-content";

    const elJudul = document.createElement("div");
    elJudul.className = "toast-title";
    elJudul.textContent = judul;

    const elPesan = document.createElement("div");
    elPesan.className = "toast-message";
    elPesan.textContent = pesan;

    isi.append(elJudul, elPesan);
    toast.append(ikon, isi);
    container.appendChild(toast);

    setTimeout(function () {
        toast.classList.add("hide");
        setTimeout(function () { toast.remove(); }, 300);
    }, 5500);

    if ("Notification" in window && Notification.permission === "granted") {
        new Notification(judul, { body: pesan });
    }
}


/* =========================================================
   KETERLAMBATAN
   ========================================================= */

function formatDurasi(totalMenit) {
    const jam   = Math.floor(totalMenit / 60);
    const menit = totalMenit % 60;

    if (jam && menit) return `${jam} jam ${menit} menit`;
    if (jam)          return `${jam} jam`;
    return `${menit} menit`;
}

/* waktu = objek Date (waktu real-time saat tap) */
function hitungKeterlambatan(waktu) {
    const menitAbsen = waktu.getHours() * 60 + waktu.getMinutes();
    const menitBatas = BATAS_JAM * 60 + BATAS_MENIT;

    if (menitAbsen <= menitBatas) {
        return { terlambat: false, teks: "" };
    }

    return { terlambat: true, teks: formatDurasi(menitAbsen - menitBatas) };
}

/* jam = "HH:MM:SS" dari database */
function teksTerlambatDariJam(jam) {
    const [h, m] = String(jam || "").split(":").map(Number);
    if (isNaN(h) || isNaN(m)) return "Terlambat";

    const selisih = h * 60 + m - (BATAS_JAM * 60 + BATAS_MENIT);
    return selisih > 0 ? "Terlambat " + formatDurasi(selisih) : "Terlambat";
}


/* =========================================================
   TAMPILAN DATA SISWA
   ========================================================= */

function isiDataSiswa(metode, isTerlambat = false, durasi = "") {
    if (!siswaAktif) return;

    const waktu = new Date();

    const data = {
        nama: siswaAktif.nama,
        absen: siswaAktif.absen,
        nis: siswaAktif.nis,
        kelas: siswaAktif.kelas,
        jurusan: siswaAktif.jurusan,
        tanggal: waktu.toLocaleDateString("id-ID"),
        jam: waktu.toLocaleTimeString("id-ID"),
        metode
    };

    Object.entries(data).forEach(function ([id, nilai]) {
        document.getElementById(id).textContent = nilai;
    });

    document.getElementById("fotoSiswa").src = siswaAktif.foto;
    document.getElementById("fotoFrame").style.display = "block";

    const statusEl = document.getElementById("status");
    const checkEl  = document.getElementById("attendanceCheck");

    if (isTerlambat) {
        statusEl.textContent = `PRESENSI BERHASIL — Terlambat (${durasi})`;
        statusEl.classList.add("terlambat");
        checkEl.classList.add("terlambat");
        checkEl.innerHTML = SVG_WARNING;
    } else {
        statusEl.textContent = "PRESENSI BERHASIL — Hadir";
        statusEl.classList.remove("terlambat");
        checkEl.classList.remove("terlambat");
        checkEl.innerHTML = SVG_CHECK;
    }

    buatQRCode();
}


/* =========================================================
   QR CODE
   ========================================================= */

function buatQRCode() {
    const qrcode = document.getElementById("qrcode");
    qrcode.innerHTML = "";

    new QRCode(qrcode, {
        text: URL_WEBSITE + "?absen=" + encodeURIComponent(siswaAktif.absen),
        width: 180,
        height: 180,
        correctLevel: QRCode.CorrectLevel.M
    });

    document.getElementById("qrcodeBox").style.display = "block";
}

function unduhQR() {
    if (!siswaAktif) return;

    const namaFile = `QR-${siswaAktif.nama.replace(/\s+/g, "-")}-${siswaAktif.absen}.png`;
    const canvas = document.querySelector("#qrcode canvas");
    const img    = document.querySelector("#qrcode img");

    const sumber = canvas ? canvas.toDataURL("image/png") : (img ? img.src : null);
    if (!sumber) return;

    const link = document.createElement("a");
    link.download = namaFile;
    link.href = sumber;
    link.click();
}


/* =========================================================
   PINDAH HALAMAN
   ========================================================= */

function pindahHalaman(sembunyi, tampil) {
    sembunyi.forEach(function (id) {
        const el = document.getElementById(id);
        if (!el) return;

        el.classList.add("page-hiding");
        setTimeout(function () {
            el.style.display = "none";
            el.classList.remove("page-hiding");
        }, 220);
    });

    setTimeout(function () {
        tampil.forEach(function (id) {
            const el = document.getElementById(id);
            if (!el) return;

            el.style.display = "block";
            el.classList.add("page-visible");
            setTimeout(function () { el.classList.remove("page-visible"); }, 450);
        });
    }, 220);
}

function kembaliKeTap() {
    history.replaceState({}, "", window.location.pathname);
    pindahHalaman(["dataPage"], ["tapPage", "riwayatPage"]);
    tampilkanRiwayat();
}


/* =========================================================
   TAP KARTU (simulasi)
   ========================================================= */

function tapKartu() {
    setReader("Scanning...", "scanning");
    btnTap.disabled = true;

    setTimeout(function () {

        if (!siswaKartu) {
            setReader("Scan gagal, cobalah lagi", "failed");
            btnTap.disabled = false;
            return;
        }

        siswaAktif = siswaKartu;
        setReader("Kartu berhasil dibaca", "success");

        setTimeout(function () {
            pindahHalaman(["tapPage", "riwayatPage"], ["dataPage"]);
            catatPresensi("Kartu");
            btnTap.disabled = false;
        }, 3000);

    }, 2500);
}


/* =========================================================
   CATAT PRESENSI
   ========================================================= */

async function catatPresensi(metode) {
    const waktu = new Date();
    const hari  = waktu.getDay();
    const statusEl = document.getElementById("status");

    /* Akhir pekan */
    if (hari === 0 || hari === 6) {
        isiDataSiswa(metode);
        statusEl.textContent = "Presensi hanya berlaku Senin–Jumat";
        statusEl.classList.remove("terlambat");

        tampilkanNotifikasi("Presensi Ditolak", "Presensi hanya berlaku Senin–Jumat", true);
        return;
    }

    const hasil = hitungKeterlambatan(waktu);
    isiDataSiswa(metode, hasil.terlambat, hasil.teks);

    try {
        await panggilApi(URL_API_KEHADIRAN, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                aksi: "tap",
                absen: siswaAktif.absen,
                tanggal: formatTanggalDB(waktu),
                jam: formatJamDB(waktu),
                status: hasil.terlambat ? "Terlambat" : "Hadir"
            })
        });
    } catch (error) {

        if (error.duplikat) {
            statusEl.textContent = "Sudah melakukan presensi hari ini";
            statusEl.classList.add("terlambat");
            tampilkanNotifikasi("Presensi Ganda", error.message, true);
        } else {
            statusEl.textContent = "Presensi gagal disimpan ke database";
            statusEl.classList.add("terlambat");
            tampilkanNotifikasi("Gagal Menyimpan", error.message, true);
        }
        return;
    }

    if (hasil.terlambat) {
        tampilkanNotifikasi(
            "Terlambat " + hasil.teks,
            "Anda terlambat, silahkan lapor ke guru",
            true
        );
    } else {
        tampilkanNotifikasi(
            "Presensi Berhasil",
            `${siswaAktif.nama} (Absen ${siswaAktif.absen}) hadir tepat waktu • ${waktu.toLocaleTimeString("id-ID")}`,
            false
        );
    }

    tampilkanRiwayat();
}


/* =========================================================
   INISIALISASI
   ========================================================= */

setInterval(function () {
    if (document.getElementById("riwayatPage").style.display !== "none") tampilkanRiwayat();
}, 10000);

pilihSiswa.addEventListener("change", function () { gantiSiswa(this.value); });
btnTap.addEventListener("click", tapKartu);
document.getElementById("btnKembali").addEventListener("click", kembaliKeTap);
document.getElementById("btnUnduhQR").addEventListener("click", unduhQR);

window.addEventListener("DOMContentLoaded", async function () {

    mintaIzinNotifikasi();

    try {
        await muatSiswa();
    } catch (error) {
        setReader("Gagal memuat siswa: " + error.message, "failed");
        tampilkanRiwayat();
        return;
    }

    btnTap.disabled = false;
    tampilkanRiwayat();

    const absenQR = new URLSearchParams(window.location.search).get("absen");
    const siswaQR = absenQR
        ? daftarSiswa.find(function (s) { return s.absen === absenQR; })
        : null;

    /* Dibuka dari QR */
    if (siswaQR) {
        siswaKartu = siswaQR;
        siswaAktif = siswaQR;
        pilihSiswa.value = absenQR;

        document.getElementById("tapPage").style.display = "none";
        document.getElementById("riwayatPage").style.display = "none";
        document.getElementById("dataPage").style.display = "block";

        catatPresensi("QR Code");
        return;
    }

    /* Default: siswa nomor absen 5 (atau yang pertama) */
    const awal = daftarSiswa.find(function (s) { return s.absen === "5"; }) || daftarSiswa[0];
    if (awal) {
        pilihSiswa.value = awal.absen;
        gantiSiswa(awal.absen);
    }
});
</script>
